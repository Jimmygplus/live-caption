<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>字幕直播间 · Live Caption</title>
  <link rel="stylesheet" href="./input.css" />
</head>
<body>
  <main>
    <header>
      <span class="mark" aria-hidden="true">◉</span>
      <div>
        <h1>字幕直播间</h1>
        <p>实时查看原文和译文，也可以用文字参与现场。</p>
        <p lang="en">Live captions and text participation for non-speaking, Deaf, and hard-of-hearing people.</p>
      </div>
    </header>

    <section id="captionPanel" class="caption-panel" aria-labelledby="captionTitle">
      <div class="caption-heading">
        <h2 id="captionTitle">现场字幕</h2>
        <span id="captionState">等待主持端开始</span>
      </div>
      <p id="captionEmpty" class="caption-empty">字幕开始后会实时显示在这里。</p>
      <ol id="captionList" class="caption-list" aria-live="polite" aria-relevant="additions text"></ol>
    </section>

    <form id="messageForm">
      <h2>文字发言</h2>
      <label for="name">显示名称（选填）</label>
      <input id="name" maxlength="30" autocomplete="name" placeholder="例如：Jimmy" />

      <label for="language">输入语言</label>
      <select id="language">
        <option value="auto" selected>自动判断</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>

      <label for="message">想表达的内容</label>
      <textarea id="message" maxlength="500" rows="7" required autofocus
        placeholder="在这里输入，现场会看到原文……"></textarea>
      <div class="between">
        <span id="count">0 / 500</span>
        <span>Ctrl / ⌘ + Enter 发送</span>
      </div>

      <button id="sendBtn" type="submit">发送到所有字幕屏幕</button>
    </form>

    <p id="status" role="status" aria-live="polite">正在连接会话……</p>
    <section id="lastSent" hidden>
      <strong id="lastState">已发送</strong>
      <p id="lastText"></p>
    </section>
  </main>
  <script type="module" src="./input.js"></script>
</body>
</html>
