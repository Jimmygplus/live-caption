# Publishes public/ to GitHub Pages. No build step — the app is plain files.
name: Deploy static site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # GitHub Pages serves assets with Cache-Control: max-age=600 and offers no
      # way to change that, so a deploy would otherwise reach open tabs up to ten
      # minutes late — and mixed: fresh HTML against a stale script. Stamping the
      # commit sha onto the asset URLs makes each deploy a distinct URL, so the
      # only thing that can lag is the HTML itself.
      - name: Cache-bust asset URLs
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s|\./styles\.css|./styles.css?v=$v|; s|\./app\.js|./app.js?v=$v|" public/index.html
          sed -i "s|\./input\.css|./input.css?v=$v|; s|\./input\.js|./input.js?v=$v|" public/input.html
          sed -i "s|\./pcm-worklet\.js|./pcm-worklet.js?v=$v|; s|\./glossaries\.json|./glossaries.json?v=$v|; s|\./qr\.js|./qr.js?v=$v|; s|\./audience-crypto\.js|./audience-crypto.js?v=$v|; s|\./relay-config\.js|./relay-config.js?v=$v|" public/app.js
          sed -i "s|\./audience-crypto\.js|./audience-crypto.js?v=$v|; s|\./relay-config\.js|./relay-config.js?v=$v|" public/input.js
          echo "stamped $v"
          grep -Rho '\./[a-z-]*\.\(css\|js\)\?v=[0-9a-f]*' public/index.html public/input.html public/app.js public/input.js | sort -u

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
