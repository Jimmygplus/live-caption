# One workflow for the whole deploy, because the pieces must land in order:
# the frontend only talks to Workers it matches, so Workers go first and Pages
# waits on them. Tests gate both. Deploying from here also keeps the release
# path off any one laptop.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a run in flight: a half-applied deploy would leave the Workers
# and the static site on different versions, which is the exact skew this
# workflow exists to prevent. Queue instead.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # The project has no dependencies and no lockfile, so pin the one tool it
  # shells out to rather than letting npx resolve a new major on its own.
  WRANGLER_VERSION: "4.128.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install step: the suite runs on node:test and built-ins only.
      - run: npm test

  workers:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Values set with `wrangler secret put` are stored apart from the script
      # and survive a deploy, so CI never has to hold SONIOX_API_KEY,
      # TRIAL_PASSWORDS or TRIAL_RATE_SALT. Keep it that way.
      #
      # Without a token the Workers are simply left alone and the static site
      # still ships: failing here would block a frontend deploy on credentials
      # that only gate the backend half.
      - name: Deploy caption relay
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler@${{ env.WRANGLER_VERSION }} deploy --config relay/wrangler.jsonc

      - name: Deploy trial broker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler@${{ env.WRANGLER_VERSION }} deploy --config trial/wrangler.jsonc

      - name: Warn that Workers were skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set — Workers were not deployed. Deploy them with wrangler, or add the secret to let CI do it."

  pages:
    needs: workers
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # GitHub Pages serves assets with Cache-Control: max-age=600 and offers no
      # way to change that, so a deploy would otherwise reach open tabs up to ten
      # minutes late — and mixed: fresh HTML against a stale script. Stamping the
      # commit sha onto the asset URLs makes each deploy a distinct URL, so the
      # only thing that can lag is the HTML itself.
      - name: Cache-bust asset URLs
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s|\./v2\.css|./v2.css?v=$v|; s|\./app\.js|./app.js?v=$v|" public/index.html
          sed -i "s|\./styles\.css|./styles.css?v=$v|; s|\./app\.js|./app.js?v=$v|" public/v1.html
          sed -i "s|\./input\.css|./input.css?v=$v|; s|\./input\.js|./input.js?v=$v|" public/input.html
          sed -i "s|\./pcm-worklet\.js|./pcm-worklet.js?v=$v|; s|\./glossaries\.json|./glossaries.json?v=$v|; s|\./qr\.js|./qr.js?v=$v|; s|\./audio-check\.js|./audio-check.js?v=$v|; s|\./audio-source\.js|./audio-source.js?v=$v|; s|\./font-size\.js|./font-size.js?v=$v|; s|\./caption-state\.js|./caption-state.js?v=$v|; s|\./audience-crypto\.js|./audience-crypto.js?v=$v|; s|\./join-crypto\.js|./join-crypto.js?v=$v|; s|\./relay-config\.js|./relay-config.js?v=$v|; s|\./trial-code\.js|./trial-code.js?v=$v|; s|\./trial-config\.js|./trial-config.js?v=$v|" public/app.js
          sed -i "s|\./audience-crypto\.js|./audience-crypto.js?v=$v|; s|\./caption-state\.js|./caption-state.js?v=$v|; s|\./relay-config\.js|./relay-config.js?v=$v|" public/input.js
          echo "stamped $v"
          grep -Rho '\./[a-z-]*\.\(css\|js\)\?v=[0-9a-f]*' public/index.html public/input.html public/app.js public/input.js public/v1.html | sort -u

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
